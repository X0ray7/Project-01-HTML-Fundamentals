<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ex04</title>
  </head>
  <body>
    <form>
      <label for="username">Name: </label>
      <input type="text" name="Name" id="username" /> <br />
      <label for="email">Mail: </label>
      <input type="email" name="The email" id="email" /> <br />
      <label for="password">Password: </label>
      <input type="password" name="Password" id="password" />
      <br />
      <hr />
      Gender:
      <br />
      <label for="male">Male: </label>
      <input type="radio" name="Gender" id="male" value="male" /> <br />
      <label for="female">Female: </label>
      <input type="radio" name="Gender" id="female" value="female" /> <br />
      <hr />
      Tick the programming language you like:
      <br />
      <label for="checkJ">Java</label>
      <input type="checkbox" name="CheckJava" id="checkJ" value="java" />
      <br />
      <label for="checkP">Python </label>
      <input type="checkbox" name="CheckPython" id="checkP" value="python" />
      <br />
      <label for="checkC">C </label>
      <input type="checkbox" name="CheckC" id="checkC" value="C" />
      <br />
      <hr />
      <label for="country">Sellect your counrty:</label>
      <select name="country" id="country">
        <option value="Jo">Jordan</option>
        <option value="Sy">syrya</option>
        <option value="SA">Saudi Arabia</option>
      </select>
      <br />
      <hr />
      <label for="comment">Comment: </label>
      <br />
      <textarea name="comment" id="comment"></textarea>
      <br />
      <button type="submit">Submit</button>
    </form>
  </body>
</html>
